<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#0e1513" media="(prefers-color-scheme: dark)">

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Saku Rapi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Layout: satu kolom selebar HP, kartu saldo pribadi di atas, dana terpisah di bawahnya, navigasi tetap di bawah. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#14201d; --muted:#62706c; --line:#e1e6e4;
  --accent:#0f5c4d; --accent-ink:#ffffff; --hero:#0f5c4d; --hero-ink:#f2faf7; --hero-soft:rgba(255,255,255,.14);
  --in:#17804f; --out:#c2413b; --tile:#eaf0ee; --shade:rgba(10,25,21,.45);
  --display:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --body:"Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1513; --surface:#172220; --ink:#e9f0ed; --muted:#93a39e; --line:#26332f;
  --accent:#4fc3a6; --accent-ink:#06211b; --hero:#164b40; --hero-ink:#eefaf6; --hero-soft:rgba(255,255,255,.12);
  --in:#5fd39a; --out:#f08a80; --tile:#1f2d2a; --shade:rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#172220; --ink:#e9f0ed; --muted:#93a39e; --line:#26332f;
  --accent:#4fc3a6; --accent-ink:#06211b; --hero:#164b40; --hero-ink:#eefaf6; --hero-soft:rgba(255,255,255,.12);
  --in:#5fd39a; --out:#f08a80; --tile:#1f2d2a; --shade:rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:480px;margin:0 auto;padding-block:18px 108px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top h1{font-family:var(--display);font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
.top p{margin:0;color:var(--muted);font-size:13px}
.note{background:var(--tile);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;justify-content:space-between}
.note button{color:var(--accent);font-weight:600;white-space:nowrap}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:-.02em;overflow-wrap:anywhere}
.hero .row{display:flex;gap:10px}
.hero .mini{flex:1;min-width:0;background:var(--hero-soft);border-radius:14px;padding:10px 12px}
.hero .mini span{display:block;font-size:12px;opacity:.85}
.hero .mini b{font-family:var(--display);font-size:15px;overflow-wrap:anywhere}

h2{font-family:var(--display);font-size:16px;font-weight:700;margin:0;text-wrap:balance}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-head small{color:var(--muted);font-size:12px}
.link{color:var(--accent);font-weight:600;font-size:13px}

.funds{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fund{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0;text-align:left;display:flex;flex-direction:column;gap:4px}
.fund .e{font-size:20px}
.fund span{font-size:12px;color:var(--muted)}
.fund b{font-family:var(--display);font-size:14px;overflow-wrap:anywhere}
@media (max-width:360px){.funds{grid-template-columns:1fr}}

.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.item + .item{border-top:1px solid var(--line)}
.ico{width:40px;height:40px;border-radius:12px;background:var(--tile);display:grid;place-items:center;font-size:20px;flex:none}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mid span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600;white-space:nowrap}
.amt.in{color:var(--in)} .amt.out{color:var(--out)} .amt.tr{color:var(--muted)}
.day{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.group-total{font-family:var(--display);font-weight:700}
.month{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
.month b{font-family:var(--display)}
.month button{width:38px;height:38px;border-radius:10px;background:var(--tile);font-size:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-family:var(--display);font-size:14px;overflow-wrap:anywhere}
.bars{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:14px}
.bar-top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.bar-top span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:8px;border-radius:99px;background:var(--tile);margin-top:6px;overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--accent)}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom, 0px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));z-index:5}
.nav-in{max-width:448px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:64px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:6px 0;border-radius:10px}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.plus{justify-self:center;width:52px;height:52px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-size:28px;line-height:1;display:grid;place-items:center;transform:translateY(-10px)}

.shade{position:fixed;inset:0;background:var(--shade);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.close{width:34px;height:34px;border-radius:10px;background:var(--tile);font-size:16px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--tile);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:9px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.amount{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:6px}
.amount span{font-family:var(--display);font-weight:700;color:var(--muted);font-size:20px}
.amount input{border:0;background:none;font-family:var(--display);font-weight:800;font-size:32px;width:100%;min-width:0;padding:0;outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:14px;border:1px solid var(--line);font-size:11px;min-width:0}
.cat .e{font-size:22px}
.cat span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat[aria-pressed="true"]{border-color:var(--accent);background:var(--tile);font-weight:600}
.primary{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px;font-weight:600;width:100%}
.ghost{border:1px dashed var(--line);border-radius:14px;padding:12px;width:100%;color:var(--muted);font-weight:500;display:block;text-align:center;cursor:pointer}
.danger{color:var(--out);border:1px solid var(--line);border-radius:14px;padding:13px;font-weight:600;width:100%}
.err{color:var(--out);font-size:13px;margin:0}
.shot{display:flex;gap:12px;align-items:center;background:var(--tile);border-radius:14px;padding:10px;font-size:13px;color:var(--muted)}
.shot img{width:56px;height:56px;object-fit:cover;border-radius:10px;flex:none}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0;font:inherit;color:inherit;resize:vertical}
.scan{background:var(--tile);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--muted)}
.alert{background:var(--surface);border:1px solid var(--out);border-radius:14px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.pay{padding:8px 12px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:600;flex:none}
.pay.del{background:var(--tile);color:var(--out)}
.search{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
.brow{display:flex;align-items:center;gap:10px}
.brow label{flex:1;min-width:0;font-size:14px}
.brow input{width:150px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;text-align:right}
.cats.emo{grid-template-columns:repeat(6,1fr)}
.cats.emo .cat{padding:8px 2px}
.fill{display:block}
.edit-ic{color:var(--muted);font-size:15px;flex:none}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero-tog{background:var(--hero-soft);color:var(--hero-ink);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.item .mid span.wrap{white-space:normal;color:var(--accent);font-weight:500}
.top-btns{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hint{font-size:13px;color:var(--muted);margin:0}
.lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  padding-block:24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));overflow-y:auto}
.lock-e{font-size:34px}
.pin-dots{display:flex;gap:14px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pin-dot.on{background:var(--accent);border-color:var(--accent)}
.lock .err{min-height:20px;text-align:center}
.keys{display:grid;grid-template-columns:repeat(3,68px);gap:14px}
.key{width:68px;height:68px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-family:var(--display);font-size:24px;font-weight:700}
.key:active{background:var(--tile)}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <div><h1 id="title">Saku Rapi</h1><p id="subtitle"></p></div>
    <div class="top-btns">
      <button class="icon-btn" id="eye" data-act="hide"></button>
      <button class="icon-btn" data-act="security" aria-label="Pengaturan"><svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg></button>
    </div>
  </div>
  <div class="note" id="sampleNote" hidden>
    <span>Ini data contoh, bukan data Anda.</span>
    <button data-act="clear">Mulai dari kosong</button>
  </div>
  <main id="view" class="sec" style="gap:18px"></main>
</div>

<nav class="nav" aria-label="Menu utama"><div class="nav-in">
  <button class="tab" data-go="beranda"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Beranda</button>
  <button class="tab" data-go="transaksi"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg>Transaksi</button>
  <button class="plus" data-act="add" aria-label="Tambah transaksi">+</button>
  <button class="tab" data-go="dompet"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12.5h2"/></svg>Dompet</button>
  <button class="tab" data-go="laporan"><svg viewBox="0 0 24 24"><path d="M6 19V11M12 19V5M18 19v-6"/></svg>Laporan</button>
</div></nav>

<div class="shade" id="shade" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<div class="lock" id="lock" role="dialog" aria-modal="true" aria-labelledby="lockTitle" hidden>
  <div class="lock-e">🔒</div>
  <h2 id="lockTitle"></h2>
  <div class="pin-dots" id="pinDots"></div>
  <p class="err" id="lockMsg"></p>
  <div class="keys" id="keys"></div>
  <button class="link" id="lockAlt"></button>
</div>

<script>
const GROUPS = {
  pribadi:{label:'Pribadi', emoji:'👛', desc:'Masuk ke saldo pribadi'},
  kantor:{label:'Kas Kantor', emoji:'🗄️', desc:'Terpisah dari saldo pribadi'},
  investasi:{label:'Investasi', emoji:'📈', desc:'Terpisah dari saldo pribadi'},
  piutang:{label:'Piutang', emoji:'🤝', desc:'Uang Anda yang dipinjam orang'}
};
const CATS = {
  out:[['makan','🍜','Makan'],['bensin','⛽','Bensin'],['pribadi','🧴','Pribadi'],['listrik','💡','Listrik'],
       ['internet','📶','Internet'],['berobat','💊','Berobat'],['belanja','🛒','Belanja'],['transport','🛵','Transport'],
       ['hiburan','🎬','Hiburan'],['kopi','☕','Kopi'],['hadiah','🎁','Hadiah'],['piutang','🤝','Piutang'],['lain','📦','Lainnya']],
  in:[['gaji','💼','Gaji'],['bonus','🎉','Bonus'],['hasil','🌱','Hasil investasi'],['setoran','📥','Setoran kas'],['bayar','🤝','Bayar hutang'],['lain-in','🪙','Lainnya']]
};
const WALLET_EMOJI = ['🏦','🏛️','💵','📱','💳','🗄️','📈','🪙','🏠','🤝','🐷','💼'];
const cats = t => [...(CATS[t] || []), ...((S.cats && S.cats[t]) || [])];
const spendCats = () => cats('out').filter(c => c[0] !== 'piutang');
const catOf = id => [...cats('out'), ...cats('in')].find(c => c[0] === id) || ['', '📦', 'Lainnya'];

const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const ago = n => { const d = new Date(); d.setDate(d.getDate() - n); return iso(d); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => (n < 0 ? '−' : '') + 'Rp ' + Math.abs(Math.round(n)).toLocaleString('id-ID');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function seed(){
  const t = (type, amount, cat, wallet, note, days, to) => ({id:uid(), type, amount, cat, wallet, note, date:ago(days), to:to||''});
  return { sample:true,
    wallets:[
      {id:'bca',name:'BCA',group:'pribadi',emoji:'🏦',init:8450000},
      {id:'mandiri',name:'Mandiri',group:'pribadi',emoji:'🏛️',init:3200000},
      {id:'tunai',name:'Tunai',group:'pribadi',emoji:'💵',init:650000},
      {id:'gopay',name:'GoPay',group:'pribadi',emoji:'📱',init:275000},
      {id:'kas',name:'Kas Kantor',group:'kantor',emoji:'🗄️',init:5000000},
      {id:'rd',name:'Reksa Dana',group:'investasi',emoji:'📈',init:12000000},
      {id:'emas',name:'Emas',group:'investasi',emoji:'🪙',init:7500000},
      {id:'andi',name:'Pinjaman Andi',group:'piutang',emoji:'🤝',init:1500000}
    ],
    txs:[
      t('out',28000,'makan','gopay','Nasi padang',0), t('out',22000,'kopi','gopay','Kopi susu',0),
      t('out',150000,'bensin','bca','Pertamina',1), t('out',385000,'internet','bca','Tagihan internet',2),
      t('transfer',300000,'','bca','Isi GoPay',2,'gopay'), t('out',412500,'listrik','mandiri','Token listrik',3),
      t('out',175000,'berobat','tunai','Apotek',4), t('in',9500000,'gaji','bca','Gaji bulanan',5),
      t('out',640000,'belanja','bca','Belanja bulanan',6), t('transfer',1000000,'','bca','Setor reksa dana',6,'rd'),
      t('out',85000,'hiburan','gopay','Bioskop',7), t('out',240000,'belanja','kas','ATK kantor',3),
      t('in',1500000,'setoran','kas','Setoran kas',8), t('out',120000,'makan','kas','Konsumsi rapat',9),
      t('in',185000,'hasil','rd','Imbal hasil',9), t('transfer',500000,'','andi','Andi cicil hutang',10,'bca'),
      t('out',95000,'pribadi','tunai','Potong rambut',12), t('out',54000,'makan','gopay','Bakso',14),
      t('out',145000,'bensin','bca','Pertamina',20), t('out',398000,'listrik','mandiri','Token listrik',33),
      t('out',385000,'internet','bca','Tagihan internet',32), t('out',720000,'belanja','bca','Belanja bulanan',36),
      t('in',9500000,'gaji','bca','Gaji bulanan',35), t('out',310000,'makan','gopay','Makan keluarga',38)
    ]};
}

const KEY = 'saku-rapi-v1';
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) { S = null; }
if (!S || !Array.isArray(S.wallets) || !Array.isArray(S.txs)) S = seed();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };

const sal = n => S.hide ? 'Rp ••••••' : rp(n);
const wal = id => S.wallets.find(w => w.id === id);
const flowOf = w => S.txs.reduce((s, t) => {
  if (t.type === 'in' && t.wallet === w.id) return s + t.amount;
  if (t.type === 'out' && t.wallet === w.id) return s - t.amount;
  if (t.type === 'transfer') { if (t.wallet === w.id) s -= t.amount; if (t.to === w.id) s += t.amount; }
  return s; }, 0);

const MONTHS = {jan:1,feb:2,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,agu:8,agt:8,aug:8,sep:9,okt:10,oct:10,nov:11,des:12,dec:12};
const HINTS = [
  [/pertamina|shell|spbu|bensin|pertalite|pertamax/i, 'bensin'],
  [/\bpln\b|listrik|token/i, 'listrik'],
  [/indihome|telkom|wifi|internet|biznet|first media|myrepublic/i, 'internet'],
  [/apotek|apotik|klinik|rumah sakit|dokter|halodoc|kimia farma/i, 'berobat'],
  [/kopi|coffee|starbucks|kenangan|janji jiwa/i, 'kopi'],
  [/gofood|grabfood|shopeefood|resto|warung|makan|bakso|\bnasi\b|ayam|mcd|kfc/i, 'makan'],
  [/indomaret|alfamart|alfamidi|superindo|hypermart|tokopedia|shopee|lazada|blibli/i, 'belanja'],
  [/gojek|gocar|goride|grab|parkir|\btol\b|kereta|\bkai\b|transjakarta|\bmrt\b/i, 'transport'],
  [/netflix|spotify|bioskop|cgv|xxi|youtube|disney/i, 'hiburan']
];
const toNum = s => Number(s.replace(/[.,]\d{2}$/, '').replace(/\D/g, '')) || 0;
function parseDate(text){
  const ok = (y, m, d) => { y = Number(y); m = Number(m); d = Number(d); if (y < 100) y += 2000;
    if (!(m >= 1 && m <= 12 && d >= 1 && d <= 31 && y >= 2000)) return '';
    const s = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0'); return s > ago(0) ? '' : s; };
  let m = text.match(/\b(\d{4})-(\d{2})-(\d{2})\b/); if (m) return ok(m[1], m[2], m[3]);
  m = text.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4}|\d{2})\b/); if (m) return ok(m[3], m[2], m[1]);
  m = text.match(/\b(\d{1,2})\s+([A-Za-z]{3,9})\.?\s+(\d{4})\b/);
  if (m && MONTHS[m[2].slice(0, 3).toLowerCase()]) return ok(m[3], MONTHS[m[2].slice(0, 3).toLowerCase()], m[1]);
  return '';
}
function parseText(text){
  const top = [], mid = [], low = [];
  text.split(/\n+/).forEach(line => { const re = /(?:Rp\.?|IDR)\s*(\d[\d.,]*)/gi; let m;
    while ((m = re.exec(line))) { const n = toNum(m[1]); if (n < 100) continue;
      (/saldo|balance|admin|biaya|fee|limit/i.test(line) ? low : /total|nominal|jumlah|amount|bayar|sebesar|senilai/i.test(line) ? top : mid).push(n); } });
  let amounts = [...top, ...mid, ...low];
  if (!amounts.length) { const re = /\b\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{2})?\b/g; let m;
    while ((m = re.exec(text))) { const n = toNum(m[0]); if (n >= 100) amounts.push(n); } }
  amounts = [...new Set(amounts)].slice(0, 6);
  const lower = text.toLowerCase();
  let type = /\bmasuk\b|diterima|menerima|received|incoming/i.test(text) ? 'in' : 'out';
  const w = S.wallets.find(x => x.name.length >= 3 && lower.includes(x.name.toLowerCase()));
  let cat = '', note = '';
  const known = Object.keys(S.learn || {}).find(k => lower.includes(k));
  if (known) { cat = S.learn[known].c; note = S.learn[known].n; type = S.learn[known].t || type; }
  else if (type === 'in') cat = /gaji|salary|payroll/i.test(text) ? 'gaji' : 'lain-in';
  else { const h = HINTS.find(x => x[0].test(text));
    if (h) { cat = h[1]; const k = text.match(h[0])[0]; note = k[0].toUpperCase() + k.slice(1).toLowerCase(); } }
  const to = text.match(/(?:penerima|kepada|merchant|tujuan|nama toko|(?:transfer|bayar|pembayaran|dibayar) ke)\s*[:\-]?\s*([A-Za-z][A-Za-z0-9 .&'-]{2,28})/i);
  if (to && !known) note = to[1].trim();
  return {amounts, type, date:parseDate(text), wallet:w ? w.id : '', cat, note};
}

function loadOcr(){

/* ---------- PIN ---------- */
let lock = {mode:null, buf:'', first:'', msg:'', busy:false};
const LOCK_TITLE = {unlock:'Masukkan PIN', set1:'Buat PIN 6 angka', set2:'Ulangi PIN baru', off:'Masukkan PIN untuk mematikan', change:'Masukkan PIN lama'};
async function pinHash(p){
  const text = 'saku-rapi:' + p;
  try { const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); }
  catch(e) { let x = 5381; for (const c of text) x = ((x * 33) ^ c.charCodeAt(0)) >>> 0; return 'f' + x.toString(16); }
}
function drawLock(){
  $('lockTitle').textContent = LOCK_TITLE[lock.mode] || '';
  $('pinDots').innerHTML = [0,1,2,3,4,5].map(i => `<span class="pin-dot${i < lock.buf.length ? ' on' : ''}"></span>`).join('');
  $('lockMsg').textContent = lock.msg;
  const alt = $('lockAlt'); delete alt.dataset.sure;
  if (lock.mode === 'unlock') { alt.dataset.act = 'forgot'; alt.textContent = 'Lupa PIN?'; }
  else { alt.dataset.act = 'lockcancel'; alt.textContent = 'Batal'; }
}
function showLock(mode){ lock = {mode, buf:'', first:'', msg:'', busy:false}; $('lock').hidden = false; drawLock(); }
function hideLock(){ lock.mode = null; lock.busy = false; $('lock').hidden = true; render(); }
async function pressKey(k){
  if (lock.busy || !lock.mode) return;
  if (k === 'del') { lock.buf = lock.buf.slice(0, -1); return drawLock(); }
  if (lock.buf.length >= 6) return;
  lock.buf += k; lock.msg = ''; drawLock();
  if (lock.buf.length < 6) return;
  lock.busy = true; const pin = lock.buf;
  if (lock.mode === 'set1') { lock.first = pin; lock.mode = 'set2'; }
  else if (lock.mode === 'set2') {
    if (pin === lock.first) { S.pin = await pinHash(pin); save(); return hideLock(); }
    lock.mode = 'set1'; lock.msg = 'PIN tidak sama. Ulangi dari awal.'; }
  else { const ok = (await pinHash(pin)) === S.pin;
    if (!ok) lock.msg = 'PIN salah. Coba lagi.';
    else if (lock.mode === 'unlock') return hideLock();
    else if (lock.mode === 'off') { delete S.pin; save(); return hideLock(); }
    else lock.mode = 'set1'; }
  lock.buf = ''; lock.busy = false; drawLock();
}

  openSheet(`${head('Pengaturan')}
    <h2>Kunci PIN</h2>
    <div class="kv"><span>PIN aplikasi</span><span><b>${S.pin ? 'Aktif' : 'Belum dipasang'}</b></span></div>
    <p class="hint">PIN diminta setiap aplikasi dibuka, dan setelah ditinggalkan lebih dari satu menit. Kalau PIN terlupa, satu-satunya jalan adalah menghapus semua data.</p>
    ${S.pin ? `<button class="primary" data-act="locknow">Kunci sekarang</button>
      <button class="ghost" data-act="changepin">Ganti PIN</button>
      <button class="danger" data-act="offpin">Matikan PIN</button>`
    : '<button class="primary" data-act="setpin">Pasang PIN</button>'}
    <h2 style="margin-top:8px">Kategori</h2>
    <button class="ghost" data-act="cats">Kelola kategori sendiri</button>
    <h2 style="margin-top:8px">Cadangan data</h2>
    <p class="hint">Data hanya tersimpan di HP ini. Simpan cadangan secara berkala ke Files, iCloud, atau Google Drive supaya tidak hilang kalau HP rusak atau berganti.</p>
    <button class="ghost" data-act="export">Simpan cadangan</button>
    <label class="ghost" for="fImport">Pulihkan dari cadangan</label>
    <input id="fImport" type="file" accept=".json,application/json" hidden>
    <p class="err" id="impErr" hidden></p>
    <p class="hint" style="text-align:center">Versi 12 Nov 2026<br>${esc(decodeURIComponent(location.pathname))}</p>`);
}
let pendingImport = null;
async function exportData(){
  const {pin, ...data} = S;
  const name = 'saku-rapi-' + ago(0) + '.json';
  const file = new File([JSON.stringify(data, null, 1)], name, {type:'application/json'});
  try { if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file]}); return; } }
  catch(e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
document.addEventListener('change', e => {
  if (e.target.id !== 'fImport' || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => {
    let d = null; try { d = JSON.parse(r.result); } catch(err) {}
    if (!d || !Array.isArray(d.wallets) || !Array.isArray(d.txs)) { $('impErr').textContent = 'File ini bukan cadangan Saku Rapi.'; $('impErr').hidden = false; return; }
    pendingImport = d;
    openSheet(`${head('Pulihkan cadangan')}
      <p class="hint">Cadangan ini berisi ${d.wallets.length} dompet dan ${d.txs.length} transaksi. Semua data yang ada sekarang akan diganti.</p>
      <button class="primary" data-act="doimport">Ganti dengan cadangan ini</button>
      <button class="ghost" data-act="close">Batal</button>`);
  };
  r.readAsText(e.target.files[0]);
});
$('keys').innerHTML = [1,2,3,4,5,6,7,8,9].map(n => `<button class="key" data-key="${n}">${n}</button>`).join('')
  + '<span></span><button class="key" data-key="0">0</button><button class="key" data-key="del" aria-label="Hapus angka">⌫</button>';
let awayAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) awayAt = Date.now();
  else if (S.pin && !lock.mode && Date.now() - awayAt > 60000) showLock('unlock');
});

const dots = el => { const n = el.value.replace(/\D/g, ''); el.value = n ? Number(n).toLocaleString('id-ID') : ''; };

document.addEventListener('change', e => { if (e.target.id === 'fDebt') drawDebtName(); });
document.addEventListener('input', e => {
  if (e.target.getAttribute('inputmode') === 'numeric') dots(e.target);
  if (e.target.id === 'q') { search = e.target.value; $('txList').innerHTML = txListHtml(); }
});
document.addEventListener('change', e => {
  if (e.target.id !== 'fShot' || !e.target.files[0]) return;
  const f = e.target.files[0]; e.target.value = ''; readShot(f);
});
document.addEventListener('click', e => {
  if (e.target === $('shade')) return closeSheet();
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.key) return pressKey(d.key);
  if (d.act === 'hide') { S.hide = !S.hide; save(); return render(); }
  if (d.amt) { $('fAmount').value = Number(d.amt).toLocaleString('id-ID'); document.querySelectorAll('#scan .chip').forEach(x => x.setAttribute('aria-pressed', x === b)); return; }
  if (d.act === 'paste') { $('pasteBox').hidden = !$('pasteBox').hidden; if (!$('pasteBox').hidden) $('fPaste').focus(); return; }
  if (d.act === 'readPaste') { const t = $('fPaste').value.trim(); if (t) { applyScan(parseText(t)); $('pasteBox').hidden = true; } return; }
  if (d.act === 'security') return openSecurity();
  if (d.act === 'export') return exportData();
  if (d.act === 'doimport') { if (pendingImport) { S = {...pendingImport, pin:S.pin}; pendingImport = null; save(); } closeSheet(); return render(); }
  if (d.act === 'setpin') { closeSheet(); return showLock('set1'); }
  if (d.act === 'changepin') { closeSheet(); return showLock('change'); }
  if (d.act === 'offpin') { closeSheet(); return showLock('off'); }
  if (d.act === 'locknow') { closeSheet(); return showLock('unlock'); }
  if (d.act === 'lockcancel') return hideLock();
  if (d.act === 'forgot') { if (b.dataset.sure) { S = {sample:false, wallets:[], txs:[]}; save(); view = 'dompet'; hideLock(); }
    else { b.dataset.sure = '1'; b.textContent = 'Ketuk lagi: hapus semua data dan PIN'; } return; }
  if (d.go) return go(d.go);
  if (d.filter) { filter = d.filter; return render(); }
  if (d.rep) { repGroup = d.rep; return render(); }
  if (d.month) { const [y, m] = repYm.split('-').map(Number); repYm = iso(new Date(y, m - 1 + Number(d.month), 1)).slice(0,7); return render(); }
  if (d.tx) return openTx(d.tx);
  if (d.type) return setType(d.type);
  if (d.cat) { form.cat = d.cat; return drawCats(); }
  if (d.emoji) { document.querySelectorAll('#wEmoji .cat').forEach(x => x.setAttribute('aria-pressed', x === b)); return; }
  if (d.del) { if (b.dataset.sure) { S.txs = S.txs.filter(t => t.id !== d.del); save(); closeSheet(); render(); }
    else { b.dataset.sure = '1'; b.textContent = 'Ketuk sekali lagi untuk menghapus'; } return; }
  if (d.act === 'add') return openAdd();
  if (d.addwallet) return openWallet(null, d.addwallet);
  if (d.netkas) { S.netKas = d.netkas === '1'; save(); return render(); }
  if (d.wallet) return openWallet(d.wallet);
  if (d.edit) return openAdd(S.txs.find(t => t.id === d.edit));
  if (d.delwallet) { if (b.dataset.sure) { const id = d.delwallet;
      S.wallets.forEach(x => { if (x.kasIn === id) setKas(x, ''); });
      const keep = S.wallets.filter(x => x.id !== id).map(x => [x, bal(x)]);
      S.wallets = S.wallets.filter(w => w.id !== id); S.txs = S.txs.filter(t => t.wallet !== id && t.to !== id);
      keep.forEach(([x, v]) => { x.init += v - bal(x); });
      S.bills = (S.bills || []).filter(x => x.wallet !== id); save(); closeSheet(); render(); }
    else { b.dataset.sure = '1'; b.textContent = 'Ketuk lagi: hapus dompet beserta transaksinya'; } return; }
  if (d.pay) return payBill(d.pay);
  if (d.delbill) { S.bills = (S.bills || []).filter(x => x.id !== d.delbill); save(); render(); return openBills(); }
  if (d.delcat) { ['out','in'].forEach(t => { if (S.cats && S.cats[t]) S.cats[t] = S.cats[t].filter(c => c[0] !== d.delcat); }); save(); render(); return openCats(); }
  if (d.pick) { b.parentElement.querySelectorAll('.cat').forEach(x => x.setAttribute('aria-pressed', x === b)); return; }
  if (d.act === 'kasSetup') return openKasSetup();
  if (d.act === 'kasSave') return saveKasSetup();
  if (d.act === 'newcat') return openNewCat();
  if (d.act === 'ncSave') return saveNewCat();
  if (d.act === 'ncCancel') { $('newCatBox').hidden = true; return; }
  if (d.act === 'bills') return openBills();
  if (d.act === 'saveBill') return saveBill();
  if (d.act === 'budgets') return openBudgets();
  if (d.act === 'saveBudgets') return saveBudgets();
  if (d.act === 'cats') return openCats();
  if (d.act === 'saveCat') return saveCat();
  if (d.act === 'save') return saveTx();
  if (d.act === 'saveWallet') return saveWallet();
  if (d.act === 'close') return closeSheet();
  if (d.act === 'clear') { if (b.dataset.sure) { S = {sample:false, wallets:[], txs:[], pin:S.pin, hide:S.hide}; save(); go('dompet'); }
    else { b.dataset.sure = '1'; b.textContent = 'Ketuk lagi untuk mengosongkan'; } }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS.includes(h) && h !== view) { view = h; render(); } });
const h0 = location.hash.slice(1); if (VIEWS.includes(h0)) view = h0;
render();
if (S.pin) showLock('unlock');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
